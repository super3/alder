<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/alder.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies the saved theme before first paint so the app never flashes
      // light on its way to dark. The landing page is light-only, so only the
      // #app route opts in.
      ;(function () {
        try {
          var pref = localStorage.getItem('alder.theme') || 'auto'
          var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute(
            'data-theme',
            location.hash === '#app' && dark ? 'dark' : 'light',
          )
          if (localStorage.getItem('alder.privacy') === '1') {
            document.documentElement.setAttribute('data-privacy', 'on')
          }
        } catch (e) {
          /* storage blocked — fall back to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
